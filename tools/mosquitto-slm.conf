# Mosquitto config for the SLM MQTT pipeline (local debug broker).
# Copy to your mosquitto config dir and run:
#   mosquitto -c mosquitto-slm.conf -v
# (Homebrew default lives at /opt/homebrew/etc/mosquitto/slm.conf.)

# Listen on all interfaces so a WiFi gateway can reach us over the LAN.
# (Not needed for USB client-proxy mode, but harmless.)
listener 1883 0.0.0.0

# Require credentials. Create the user once with:
#   mosquitto_passwd -c /path/to/passwd slm
# then point password_file at it.
allow_anonymous false
password_file /opt/homebrew/etc/mosquitto/passwd

# Verbose logging to stdout while bringing things up.
log_dest stdout
log_type all
connection_messages true

# SLM spectra are live telemetry — nothing to retain across restarts.
persistence false
