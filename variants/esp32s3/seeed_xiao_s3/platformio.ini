[env:seeed-xiao-s3]
custom_meshtastic_hw_model = 81
custom_meshtastic_hw_model_slug = SEEED_XIAO_S3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = Seeed Xiao ESP32-S3
custom_meshtastic_images = seeed-xiao-s3.svg
custom_meshtastic_tags = Seeed
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 8MB

extends = esp32s3_base
board = seeed-xiao-s3
board_level = pr
board_check = true
board_build.partitions = default_8MB.csv
upload_protocol = esptool
upload_speed = 921600
build_flags = 
  ${esp32s3_base.build_flags}
  -D SEEED_XIAO_S3
  -I variants/esp32s3/seeed_xiao_s3
  -DBOARD_HAS_PSRAM

; ---------------------------------------------------------------------------
; SLM build: standard XIAO ESP32S3 + Wio-SX1262 + EXTERNAL PDM mic, with the
; 1/3-octave SoundLevelModule enabled. (Additive env; the stock env above is
; untouched.) Mic must sit on free GPIOs — the SX1262 owns 7/8/9/38/39/40/41/42,
; I2C/Wire uses the variant defaults SDA=47/SCL=48, GPS 43/44 — so the mic sits on
; the free D4=GPIO5 (data) / D5=GPIO6 (clk).
; Build:  pio run -e seeed-xiao-s3-slm
[env:seeed-xiao-s3-slm]
extends = env:seeed-xiao-s3
build_flags =
  ${env:seeed-xiao-s3.build_flags}
  -DSLM_ENABLED
  ; Audio DSP intentionally stays on core 0 (the code default), keeping it off
  ; the Arduino/mesh loop on core 1; if this node is also its own WiFi/MQTT gateway it then shares core 0 with the WiFi stack.
  -DSLM_PDM_CLK_PIN=6
  -DSLM_PDM_DATA_PIN=5
  -DMIC_CAL_OFFSET_DB=130.0f   ; Infineon IM72D128VV01 nominal; field-calibrate
  -DSLM_BASE_INTERVAL_MS=1000
  -DSLM_TMIN_S=15              ; minimum averaging window / transmit spacing (s)
  -DSLM_MAX_DUTY_PCT=1.0f      ; self-imposed TX duty cap; 1.0 = safe on EU868 1% sub-bands
