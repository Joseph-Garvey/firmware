[env:seeed-xiao-s3]
custom_meshtastic_hw_model = 81
custom_meshtastic_hw_model_slug = SEEED_XIAO_S3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = Seeed Xiao ESP32-S3
custom_meshtastic_images = seeed-xiao-s3.svg
custom_meshtastic_tags = Seeed
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 8MB

extends = esp32s3_base
board = seeed-xiao-s3
board_level = pr
board_check = true
board_build.partitions = default_8MB.csv
upload_protocol = esptool
upload_speed = 921600
build_flags = 
  ${esp32s3_base.build_flags}
  -D SEEED_XIAO_S3
  -I variants/esp32s3/seeed_xiao_s3
  -DBOARD_HAS_PSRAM

; ---------------------------------------------------------------------------
; SLM build: standard XIAO ESP32S3 + Wio-SX1262 + EXTERNAL PDM mic, with the
; 1/3-octave SoundLevelModule enabled. (Additive env; the stock env above is
; untouched.) Mic must sit on free GPIOs — the SX1262 owns 7/8/9/38/39/40/41/42,
; Meshtastic's I2C bus (IMU + OLED, variant.h I2C_SDA/SCL) is on GPIO5/6, GPS 43/44,
; GPIO1 = GPS standby — so the only free header pins are D1/D2/D3. The mic sits on
; D1=GPIO2 (clk) / D2=GPIO3 (data). NOTE: D4/D5 (GPIO5/6) is the I2C bus — using it
; for the mic corrupts the IMU/OLED (i2cWrite ESP_ERR_INVALID_STATE).
; Build:  pio run -e seeed-xiao-s3-slm
[env:seeed-xiao-s3-slm]
extends = env:seeed-xiao-s3
build_flags =
  ${env:seeed-xiao-s3.build_flags}
  -DSLM_ENABLED
  ; Audio DSP intentionally stays on core 0 (the code default), keeping it off
  ; the Arduino/mesh loop on core 1; if this node is also its own WiFi/MQTT gateway it then shares core 0 with the WiFi stack.
  -DSLM_AUDIO_CORE=0
  -DSLM_PDM_CLK_PIN=3       ; mic CLK  -> D1 (GPIO2)
  -DSLM_PDM_DATA_PIN=4         ; mic DATA -> D2 (GPIO3)
  -DMIC_CAL_OFFSET_DB=130.0f   ; Infineon IM72D128VV01 nominal; field-calibrate
  -DSLM_BASE_INTERVAL_MS=1000
  -DSLM_TMIN_S=15              ; minimum averaging window / transmit spacing (s)
  -DSLM_MAX_DUTY_PCT=5.0f      ; self-imposed TX duty cap; 5.0 = safe on EU868 1% sub-bands
  ; Capture-integrity diagnostics: per-interval serial log "SLM DIAG: raw <dBFS> | LAeq <dB> |
  ; ovf:<n> hz:<rate>". Use to confirm whether high/jumpy readings coincide with I2S DMA
  ; overflows (ovf rising) or a sagging capture rate (hz < 48000). Off by default; uncomment
  ; only while investigating — it adds a per-block raw sum and a log line per base interval.
  -DSLM_AUDIO_DIAG
  ; On-device anomaly log to LittleFS at /static/slm.log (downloadable on a deployed node
  ; via the WiFi web server: http://<node-ip>/slm.log). Writes only edge events (buffer
  ; drops, crest/level excursions), so it stays tiny and survives reboots. Uncomment to
  ; capture an intermittent fault on a node you can't sit and watch over serial.
  ; -DSLM_FS_LOG
  ; Slowdown/glitch investigation: each on-device feature can be compiled out on its
  ; own to A/B against the audio->LoRa baseline. Uncomment one or both (or just build
  ; the seeed-xiao-s3-slm-baseline env below, which sets both and drops SLM_AUDIO_DIAG):
  ;   -DSLM_NO_DISPLAY        ; drop the on-device OLED sound-level meter
  ;   -DSLM_NO_GLITCH_GUARD   ; drop the I2S-overflow discard guard + deeper DMA ring

; ---------------------------------------------------------------------------
; Front-of-house build: same hardware as the SLM sensor above, plus the live
; local stream (SLM_FOH_STREAM). The node still broadcasts the long-window LoRa
; frame to the command center exactly like the sensor build; additionally it
; streams the most-recent base interval to a locally connected client (BLE / USB
; serial / TCP) via sendToPhone() — no LoRa, no airtime — for a live FoH readout.
; The base interval doubles as the refresh rate: 125 ms = 8 Hz ("fast"); set it to
; 1000 for a 1 Hz ("slow") readout. Self-contained flag list (no SLM_AUDIO_DIAG)
; rather than extending the sensor env, to avoid SLM_BASE_INTERVAL_MS redefinition.
; Build:  pio run -e seeed-xiao-s3-slm-foh
[env:seeed-xiao-s3-slm-foh]
extends = env:seeed-xiao-s3
build_flags =
  ${env:seeed-xiao-s3.build_flags}
  -DSLM_ENABLED
  -DSLM_FOH_STREAM            ; live local stream to the connected FoH client
  -DSLM_AUDIO_CORE=0
  -DSLM_PDM_CLK_PIN=2          ; mic CLK  -> D1 (GPIO2)
  -DSLM_PDM_DATA_PIN=3         ; mic DATA -> D2 (GPIO3)
  -DMIC_CAL_OFFSET_DB=130.0f   ; Infineon IM72D128VV01 nominal; field-calibrate
  -DSLM_BASE_INTERVAL_MS=125   ; 8 Hz FoH refresh ("fast"); set 1000 for 1 Hz ("slow")
  -DSLM_TMIN_S=15              ; minimum averaging window / transmit spacing (s)
  -DSLM_MAX_DUTY_PCT=5.0f      ; self-imposed TX duty cap; 5.0 = safe on EU868 1% sub-bands

; ---------------------------------------------------------------------------
; Baseline / A-B-test build: same hardware and metering as the sensor env above,
; but with every on-device feature added AFTER commit 1cb7443d compiled OUT, so
; the firmware is back to "capture audio -> average -> broadcast over LoRa" and
; nothing else. Flash this alongside the normal sensor build to tell whether the
; OLED meter or the glitch-discard capture path is behind any slowdown/glitch.
; Disabled here vs. the sensor env:
;   -DSLM_NO_DISPLAY       no on-device OLED meter (drawFrame / UI frame / dispE copy)
;   -DSLM_NO_GLITCH_GUARD  no I2S-overflow callback, no drop-the-glitched-interval
;                          logic, IDF-default DMA ring (not the deeper 8x512)
;   (SLM_AUDIO_DIAG / SLM_FS_LOG / SLM_FOH_STREAM are simply left undefined)
; Build:  pio run -e seeed-xiao-s3-slm-baseline
[env:seeed-xiao-s3-slm-baseline]
extends = env:seeed-xiao-s3
build_flags =
  ${env:seeed-xiao-s3.build_flags}
  -DSLM_ENABLED
  -DSLM_NO_DISPLAY            ; A/B test: compile out the on-device OLED meter
  -DSLM_NO_GLITCH_GUARD       ; A/B test: revert to the baseline capture path
  -DSLM_AUDIO_CORE=0
  -DSLM_PDM_CLK_PIN=3          ; mic CLK  -> D1 (GPIO2) — match the sensor env
  -DSLM_PDM_DATA_PIN=4         ; mic DATA -> D2 (GPIO3) — match the sensor env
  -DMIC_CAL_OFFSET_DB=130.0f   ; Infineon IM72D128VV01 nominal; field-calibrate
  -DSLM_BASE_INTERVAL_MS=1000
  -DSLM_TMIN_S=15              ; minimum averaging window / transmit spacing (s)
  -DSLM_MAX_DUTY_PCT=5.0f      ; self-imposed TX duty cap; 5.0 = safe on EU868 1% sub-bands
