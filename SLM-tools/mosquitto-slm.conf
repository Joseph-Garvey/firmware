# Mosquitto config for the SLM MQTT pipeline (local debug broker).
# Copy to your mosquitto config dir and run:
#   mosquitto -c mosquitto-slm.conf -v
# (Homebrew default lives at /opt/homebrew/etc/mosquitto/slm.conf.)

# Listen on all interfaces so a WiFi gateway can reach us over the LAN.
# (Not needed for USB client-proxy mode, but harmless.)
listener 1883 0.0.0.0

# WebSockets listener for the browser dashboard (browsers can't speak raw MQTT/TCP).
# tools/slm_dashboard.html connects to ws://127.0.0.1:9001 and subscribes to TA/SLM/decoded/#.
listener 9001 0.0.0.0
protocol websockets

# Require credentials. Create the user once with:
#   mosquitto_passwd -c /path/to/passwd slm
# then point password_file at it.
allow_anonymous false
password_file /opt/homebrew/etc/mosquitto/passwd

# Verbose logging to stdout while bringing things up.
log_dest stdout
log_type all
connection_messages true

# Persist retained messages + queued QoS1/2 across broker restarts. The bridge publishes
# decoded frames with retain=true so the last spectrum per node survives a restart, and a
# fresh subscriber (dashboard) gets it immediately instead of waiting for the next uplink.
persistence true
persistence_location /opt/homebrew/var/lib/mosquitto/
autosave_interval 30
